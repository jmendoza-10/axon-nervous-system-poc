<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axon Nervous System - Command Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.4/socket.io.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0e17; color: #e0e6ed; }
        .header { background: #131a2b; padding: 14px 30px; border-bottom: 2px solid #f7b731; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 1.4em; color: #f7b731; }
        .header-right { display: flex; align-items: center; gap: 20px; }
        .header .status { font-size: 0.85em; color: #6c7a8d; display: flex; align-items: center; }
        .header .status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
        .header .status .dot.online { background: #27ae60; }
        .topo-mini { height: 40px; width: 160px; display: block; }
        .container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 20px 30px; max-width: 1400px; margin: 0 auto; }
        #rooms-container { display: contents; }
        .room-card { background: #131a2b; border-radius: 12px; padding: 24px; border: 1px solid #1e2a3d; transition: border-color 0.3s; }
        .room-card.presence { border-color: #f39c12; box-shadow: 0 0 20px rgba(243, 156, 18, 0.15); }
        .room-card.motion { border-color: #e74c3c; box-shadow: 0 0 20px rgba(231, 76, 60, 0.2); animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.85; } }
        .room-card h2 { font-size: 1.1em; color: #8899aa; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 1px; }
        .indicator { display: flex; gap: 16px; margin-bottom: 16px; }
        .indicator .badge { padding: 6px 16px; border-radius: 20px; font-size: 0.85em; font-weight: 600; }
        .badge.presence-yes { background: rgba(243, 156, 18, 0.2); color: #f39c12; }
        .badge.presence-no { background: rgba(108, 122, 141, 0.2); color: #6c7a8d; }
        .badge.motion-yes { background: rgba(231, 76, 60, 0.2); color: #e74c3c; }
        .badge.motion-no { background: rgba(108, 122, 141, 0.2); color: #6c7a8d; }
        .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .metric { background: #0d1320; padding: 12px; border-radius: 8px; }
        .metric .label { font-size: 0.75em; color: #6c7a8d; text-transform: uppercase; }
        .metric .value { font-size: 1.4em; font-weight: 600; color: #e0e6ed; margin-top: 4px; }
        .events-panel { grid-column: 1 / -1; background: #131a2b; border-radius: 12px; padding: 24px; border: 1px solid #1e2a3d; max-height: 400px; overflow-y: auto; }
        .events-panel h2 { font-size: 1.1em; color: #8899aa; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 1px; }
        .event-row { display: flex; gap: 16px; padding: 8px 0; border-bottom: 1px solid #1e2a3d; font-size: 0.85em; font-family: monospace; }
        .event-row .time { color: #6c7a8d; min-width: 80px; }
        .event-row .room { color: #f7b731; min-width: 80px; }
        .event-row .detail { color: #e0e6ed; flex: 1; }
        .event-row .hash { color: #3498db; min-width: 100px; text-align: right; }
        .chain-status { grid-column: 1 / -1; background: #131a2b; border-radius: 12px; padding: 16px 24px; border: 1px solid #1e2a3d; display: flex; justify-content: space-between; align-items: center; }
        .chain-status .valid { color: #27ae60; }
        .chain-status .invalid { color: #e74c3c; }
        .heatmap-section { margin-top: 16px; }
        .heatmap-section .label { font-size: 0.75em; color: #6c7a8d; text-transform: uppercase; margin-bottom: 6px; }
        .heatmap-canvas { width: 100%; height: 120px; border-radius: 6px; display: block; image-rendering: pixelated; background: #0a0e17; }
        .heatmap-legend { display: flex; justify-content: space-between; font-size: 0.7em; color: #6c7a8d; margin-top: 4px; }
        .heatmap-axis { display: flex; justify-content: space-between; font-size: 0.7em; color: #3a4a5c; margin-bottom: 2px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>AXON NERVOUS SYSTEM</h1>
        <div class="header-right">
            <svg id="topo-svg" class="topo-mini" viewBox="0 0 160 40"></svg>
            <div class="status">
                <span class="dot online"></span>
                <span id="connection-status">Connecting...</span>
            </div>
        </div>
    </div>

    <div class="container">
        <div id="rooms-container"></div>
        <div class="chain-status">
            <span>Evidence Chain</span>
            <span id="chain-info">Verifying...</span>
        </div>
        <div class="events-panel">
            <h2>Live Event Log</h2>
            <div id="events-list"></div>
        </div>
    </div>

    <script>
        const socket = io();
        const rooms = {};

        socket.on('connect', () => {
            document.getElementById('connection-status').textContent = 'Live';
        });

        socket.on('disconnect', () => {
            document.getElementById('connection-status').textContent = 'Disconnected';
        });

        socket.on('detection', (data) => {
            rooms[data.room] = data.state;
            renderRooms();
            addEvent(data);
            // Redraw spectrograms after DOM rebuild
            for (const [room, rows] of Object.entries(spectrograms)) {
                if (rows.length > 0) redrawSpectrogram(room);
            }
        });

        // --- Heatmap / Spectrogram ---
        const spectrograms = {};  // room -> array of rows (each row = N live subcarriers)
        const spectrogramCols = {};  // room -> last known column count
        const SPECTROGRAM_ROWS = 60;
        const HEAT_MAX = 15.0;  // deviation value that maps to full red

        function heatColor(value) {
            const t = Math.min(value / HEAT_MAX, 1.0);
            // Dark blue → cyan → green → yellow → orange → red
            if (t < 0.2) {
                const s = t / 0.2;
                return [Math.round(s * 26), Math.round(s * 58), Math.round(26 + s * 102)];
            } else if (t < 0.4) {
                const s = (t - 0.2) / 0.2;
                return [0, Math.round(58 + s * 115), Math.round(128 + s * 127)];
            } else if (t < 0.6) {
                const s = (t - 0.4) / 0.2;
                return [0, Math.round(173 + s * 82), Math.round(255 - s * 255)];
            } else if (t < 0.8) {
                const s = (t - 0.6) / 0.2;
                return [Math.round(s * 243), Math.round(255 - s * 98), 0];
            } else {
                const s = (t - 0.8) / 0.2;
                return [243, Math.round(157 - s * 157), 0];
            }
        }

        function redrawSpectrogram(room) {
            const canvas = document.getElementById(`heatmap-${room}`);
            if (!canvas) return;
            const rows = spectrograms[room];
            if (!rows || rows.length === 0) return;

            const numCols = rows[0].length;

            // Resize canvas to match actual subcarrier count
            if (canvas.width !== numCols) {
                canvas.width = numCols;
                const axis = document.getElementById(`heatmap-axis-${room}`);
                if (axis) {
                    axis.innerHTML = `<span>SC 1</span><span>SC ${Math.ceil(numCols/2)}</span><span>SC ${numCols}</span>`;
                }
            }

            const ctx = canvas.getContext('2d');
            const imageData = ctx.createImageData(numCols, SPECTROGRAM_ROWS);
            const data32 = new Uint32Array(imageData.data.buffer);

            for (let r = 0; r < rows.length; r++) {
                const y = SPECTROGRAM_ROWS - rows.length + r;
                for (let c = 0; c < numCols; c++) {
                    const [red, green, blue] = heatColor(rows[r][c] || 0);
                    data32[y * numCols + c] = (255 << 24) | (blue << 16) | (green << 8) | red;
                }
            }
            ctx.putImageData(imageData, 0, 0);
        }

        socket.on('heatmap', (data) => {
            const { room, values } = data;
            if (!spectrograms[room]) spectrograms[room] = [];
            spectrogramCols[room] = values.length;
            spectrograms[room].push(values);
            if (spectrograms[room].length > SPECTROGRAM_ROWS) {
                spectrograms[room].shift();
            }
            redrawSpectrogram(room);
        });

        function renderRooms() {
            const container = document.getElementById('rooms-container');
            container.innerHTML = '';
            for (const [name, state] of Object.entries(rooms)) {
                const classes = ['room-card'];
                if (state.motion) classes.push('motion');
                else if (state.presence) classes.push('presence');

                container.innerHTML += `
                    <div class="${classes.join(' ')}">
                        <h2>${name}</h2>
                        <div class="indicator">
                            <span class="badge ${state.presence ? 'presence-yes' : 'presence-no'}">
                                ${state.presence ? 'PRESENCE' : 'EMPTY'}
                            </span>
                            <span class="badge ${state.motion ? 'motion-yes' : 'motion-no'}">
                                ${state.motion ? 'MOTION' : 'STILL'}
                            </span>
                        </div>
                        <div class="metrics">
                            <div class="metric">
                                <div class="label">Variance</div>
                                <div class="value">${(state.variance || 0).toFixed(2)}</div>
                            </div>
                            <div class="metric">
                                <div class="label">Temporal Var</div>
                                <div class="value">${(state.temporal_var || 0).toFixed(2)}</div>
                            </div>
                        </div>
                        <div class="heatmap-section">
                            <div class="label">CSI Subcarrier Heatmap <span style="color:#3a4a5c">(time↑ · subcarriers→)</span></div>
                            <div class="heatmap-axis" id="heatmap-axis-${name}"><span>SC 1</span>${spectrogramCols[name] ? `<span>SC ${Math.ceil(spectrogramCols[name]/2)}</span><span>SC ${spectrogramCols[name]}</span>` : '<span>...</span>'}</div>
                            <canvas class="heatmap-canvas" id="heatmap-${name}" width="${spectrogramCols[name] || 53}" height="60"></canvas>
                            <div class="heatmap-legend"><span style="color:#1a3a5c">■ low</span><span style="color:#1a6b8a">■</span><span style="color:#27ae60">■</span><span style="color:#f39c12">■</span><span style="color:#e74c3c">■ high</span></div>
                        </div>
                    </div>
                `;
            }
        }

        function addEvent(data) {
            const list = document.getElementById('events-list');
            const now = new Date().toLocaleTimeString();
            const detail = data.state.presence
                ? (data.state.motion ? 'Motion detected' : 'Presence confirmed')
                : 'Room empty';

            const row = document.createElement('div');
            row.className = 'event-row';
            row.innerHTML = `
                <span class="time">${now}</span>
                <span class="room">${data.room}</span>
                <span class="detail">${detail} (var: ${(data.state.variance || 0).toFixed(2)})</span>
                <span class="hash">${data.hash || ''}</span>
            `;
            list.insertBefore(row, list.firstChild);

            // Keep last 100 events in DOM
            while (list.children.length > 100) {
                list.removeChild(list.lastChild);
            }
        }

        // Verify evidence chain periodically
        async function verifyChain() {
            try {
                const res = await fetch('/api/evidence/verify');
                const data = await res.json();
                const el = document.getElementById('chain-info');
                if (data.valid) {
                    el.className = 'valid';
                    el.textContent = `Valid (${data.count} records)`;
                } else {
                    el.className = 'invalid';
                    el.textContent = `BROKEN at record ${data.broken_at}`;
                }
            } catch (e) {
                document.getElementById('chain-info').textContent = 'Error checking chain';
            }
        }

        // Initial data load
        fetch('/api/rooms').then(r => r.json()).then(data => {
            Object.assign(rooms, data);
            renderRooms();
        });

        // --- Topology Map (compact header widget) ---
        function renderTopology(topoData) {
            const svg = document.getElementById('topo-svg');
            const roomNames = Object.keys(topoData);

            // Layout: [Room A]---[CMD]---[Room B]  horizontally at y=20
            const cy = 20;
            const roomAState = rooms[roomNames[0]] || {};
            const roomBState = rooms[roomNames[1]] || {};
            const nodes = [
                { label: 'A', online: topoData[roomNames[0]]?.online ?? false, x: 20, presence: roomAState.presence, motion: roomAState.motion },
                { label: 'CMD', online: true, x: 80 },
                { label: 'B', online: topoData[roomNames[1]]?.online ?? false, x: 140, presence: roomBState.presence, motion: roomBState.motion },
            ];
            // Override labels if room names are available
            if (roomNames.length >= 1) nodes[0].label = roomNames[0].replace(/room_?/i, '').toUpperCase() || 'A';
            if (roomNames.length >= 2) nodes[2].label = roomNames[1].replace(/room_?/i, '').toUpperCase() || 'B';

            let html = '';
            // Links: A--CMD and CMD--B
            for (const [from, to] of [[0,1],[1,2]]) {
                const online = nodes[from].online && nodes[to].online;
                const color = online ? '#27ae60' : '#3a4a5c';
                const dash = online ? '' : 'stroke-dasharray="4 3"';
                html += `<line x1="${nodes[from].x + 7}" y1="${cy}" x2="${nodes[to].x - 7}" y2="${cy}" stroke="${color}" stroke-width="1.5" ${dash} opacity="0.7"/>`;
            }
            // Nodes
            for (const n of nodes) {
                let fill = n.online ? '#27ae60' : '#6c7a8d';
                let centerFill = fill;
                if (n.motion) {
                    centerFill = '#e74c3c';
                } else if (n.presence) {
                    centerFill = '#f39c12';
                }
                html += `<circle cx="${n.x}" cy="${cy}" r="6" fill="#131a2b" stroke="${fill}" stroke-width="1.5"/>`;
                html += `<circle cx="${n.x}" cy="${cy}" r="2.5" fill="${centerFill}"/>`;
                html += `<text x="${n.x}" y="${cy + 14}" fill="#6c7a8d" font-size="7" text-anchor="middle" font-family="monospace">${n.label}</text>`;
            }
            svg.innerHTML = html;
        }

        async function refreshTopology() {
            try {
                const res = await fetch('/api/topology');
                const data = await res.json();
                renderTopology(data);
            } catch (e) {
                renderTopology({});
            }
        }

        // Also update topology on each detection event
        socket.on('detection', () => { refreshTopology(); });

        refreshTopology();
        setInterval(refreshTopology, 5000);

        setInterval(verifyChain, 10000);
        verifyChain();
    </script>
</body>
</html>
